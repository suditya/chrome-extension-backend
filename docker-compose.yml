services:
  mongodb:
    image: mongo:7.0
    container_name: leetsrs-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: Leetcode-Extension
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: leetsrs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leetsrs-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: Leetcode-Extension
      ADMIN_EMAIL: ${ADMIN_EMAIL:-leetcodereminderx@gmail.com}
      ADMIN_PASS: ${ADMIN_PASS:-placeholder}
      CORS_ORIGIN: "*"
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:3000}
    depends_on:
      - mongodb
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leetsrs-worker
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: Leetcode-Extension
      ADMIN_EMAIL: ${ADMIN_EMAIL:-leetcodereminderx@gmail.com}
      ADMIN_PASS: ${ADMIN_PASS:-placeholder}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:3000}
    depends_on:
      - mongodb
      - redis

volumes:
  mongo-data:
  redis-data:

